name: Publish revised Connecticut Tableau story

on:
  push:
    paths:
      - .github/workflows/publish-connecticut-story.yml
      - scripts/clean_connecticut_story.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XML dependency
        run: python -m pip install lxml
      - name: Clean and verify Tableau story
        run: python scripts/clean_connecticut_story.py
      - name: Publish revised workbook download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/dashboards/connecticut-drug-related-mortality-tableau-revised.twbx
          if git diff --cached --quiet; then
            echo "The revised workbook is already up to date."
          else
            git commit -m "Publish clean Connecticut Tableau workbook"
            git push
          fi
