name: Publish portfolio Tableau workbooks
on:
  push:
    paths:
      - '.github/portfolio-transfers/**'
      - '.github/workflows/publish-portfolio-workbooks.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble uploaded workbooks and validate integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, zipfile
          root=pathlib.Path('.github/portfolio-transfers')
          manifests={
            'border':('projects/dashboards/us-border-crossings-interactive-dashboard.twbx','88833425cbd4de28d62bf9e9563b2a56c3668affce2fcd2f0cca16a677c0d493'),
            'healthcare':('projects/dashboards/healthcare-analytics-tableau-expanded.twbx','bea2344d0b62f7fc26f854b3cb2a373dc0bbc57ebbfddc1e594520b5025a65fb'),
          }
          for key,(name,expected) in manifests.items():
            parts=sorted((root/key).glob('*.b64')) if (root/key).exists() else []
            if not parts:
              print('No pending upload for',key)
              continue
            joined=b''.join(p.read_bytes().strip() for p in parts)
            data=base64.b64decode(joined,validate=True)
            assert hashlib.sha256(data).hexdigest()==expected, f'{key} SHA256 mismatch'
            dest=pathlib.Path(name);dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(data)
            with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              assert any(n.endswith('.twb') for n in z.namelist())
            print('Verified',name,len(data),'bytes')
          PY
      - name: Commit verified workbooks and remove temporary transfers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A projects/dashboards .github/portfolio-transfers
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No pending changes'
          else
            git commit -m 'Publish verified Tableau portfolio workbook assets'
            git push
          fi
