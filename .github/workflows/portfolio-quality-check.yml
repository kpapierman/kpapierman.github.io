name: Portfolio links and files

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'styles.css'
      - 'projects/**'
      - 'assets/**'
      - 'scripts/verify_portfolio.py'
      - '.github/workflows/portfolio-quality-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portfolio pages and downloads
        run: python scripts/verify_portfolio.py
